<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Planet body -->
  <circle cx="32" cy="32" r="16" fill="#3b82f6"/>
  <!-- Shading for a spherical look -->
  <circle cx="32" cy="32" r="16" fill="url(#shade)"/>
  <!-- Surface craters / texture -->
  <circle cx="26" cy="26" r="3" fill="#1d4ed8" opacity="0.6"/>
  <circle cx="38" cy="34" r="2.2" fill="#1d4ed8" opacity="0.5"/>
  <circle cx="29" cy="38" r="1.6" fill="#1d4ed8" opacity="0.5"/>
  <!-- Orbit ring -->
  <ellipse cx="32" cy="32" rx="27" ry="9" fill="none" stroke="#f59e0b" stroke-width="3"
    transform="rotate(-18 32 32)" stroke-linecap="round"/>
  <!-- Small moon -->
  <circle cx="53" cy="18" r="3" fill="#e11d48"/>
  <defs>
    <radialGradient id="shade" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
</svg>
